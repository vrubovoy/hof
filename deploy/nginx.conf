# nginx in front of Hof (ARCHITECTURE.md §4.5, §4.6, §4.9, §9).
#
# A template: when the container starts, the nginx image puts the domain from its environment in
# place of ${HOF_DOMAIN} and writes the result over /etc/nginx/conf.d/default.conf, the default site
# of the image. Names with a lower-case $ are variables of nginx; the image leaves them as they are.
# Everything here goes into the http block of the image's own nginx.conf.

server_tokens off;

# Access log: address, time, method, path without the query, status and size. A query may carry an
# amount (/saeckel/transfer?…&amount=), and the Referer is a whole address of Hof with its query,
# so neither is written (§4.10). Each server below names this format: an access_log of a server
# replaces the one of the image.
log_format hof '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

# §4.5: sign-in attempts per IP address. Only POST counts: for any other method the key is empty,
# and nginx does not count a request with an empty key.
map $request_method $hof_attempt_key {
    POST    $binary_remote_addr;
    default '';
}
limit_req_zone $hof_attempt_key zone=hof_attempts:10m rate=10r/m;
limit_req_status 429;

# Any other name in Host, and requests to the bare IP address: the connection is closed without an
# answer. On 443 the TLS handshake fails before that: there is no certificate for another name.
server {
    listen 80 default_server;
    access_log /var/log/nginx/access.log hof;
    return 444;
}

server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    access_log /var/log/nginx/access.log hof;
    return 444;
}

# Port 80 of the domain only sends to HTTPS. While certbot renews the certificate, nginx is stopped
# and certbot answers on this port itself.
server {
    listen 80;
    server_name ${HOF_DOMAIN};
    access_log /var/log/nginx/access.log hof;
    return 301 https://${HOF_DOMAIN}$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${HOF_DOMAIN};
    access_log /var/log/nginx/access.log hof;

    # Read-only files of certbot on the host, mounted at the same paths (compose.yaml).
    ssl_certificate     /etc/letsencrypt/live/${HOF_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${HOF_DOMAIN}/privkey.pem;

    # Mozilla intermediate: TLS 1.2 and 1.3; for TLS 1.2 only ECDHE with AES-GCM or ChaCha20, so no
    # file of DH parameters is needed. No OCSP stapling: Let's Encrypt has no OCSP any more.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:hof_tls:10m;
    ssl_session_tickets off;

    # A year, for this domain only: the neighbouring subdomains of the owner are not ours to decide.
    # `always` puts it on 4xx and 5xx answers as well. No location below has an add_header of its
    # own: one would stop this header from being inherited there.
    add_header Strict-Transport-Security 'max-age=31536000' always;

    # Host as the client sent it: Hof compares Origin with it (§4.6). X-Real-IP is always the
    # address of the connection (§4.10). The usual forwarding headers of the client are removed;
    # other X-Forwarded-* pass, but Hof reads none of them.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For '';
    proxy_set_header X-Forwarded-Host '';
    proxy_set_header X-Forwarded-Proto '';
    proxy_set_header X-Forwarded-Port '';
    proxy_set_header Forwarded '';

    location / {
        proxy_pass http://hof:3000;
    }

    # §4.5: 10 POST requests a minute with up to 10 more at once, then 429.
    location = /login {
        limit_req zone=hof_attempts burst=10 nodelay;
        proxy_pass http://hof:3000;
    }

    location = /setup {
        limit_req zone=hof_attempts burst=10 nodelay;
        proxy_pass http://hof:3000;
    }

    location = /account/password {
        limit_req zone=hof_attempts burst=10 nodelay;
        proxy_pass http://hof:3000;
    }

    error_page 429 @too_many_attempts;
    location @too_many_attempts {
        default_type 'text/plain; charset=utf-8';
        return 429 "Слишком много попыток входа. Подождите минуту.\n";
    }
}
