# Checks of every pull request and of every push to main (README.md, section «CI»): the commands of
# `npm run check`, each a step of its own, against a throwaway PostgreSQL from compose.dev.yaml.
# No secrets, no access to the server, nothing is published.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The token of the job can only read the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs: a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version of the image, so that it is written in the Dockerfile only.
      - name: Node version from the Dockerfile
        id: node
        run: |
          version=$(sed -n 's/^FROM node:\([0-9][0-9.]*\).*/\1/p' Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          package-manager-cache: false

      # Passwords of this run only; the database gets nothing but the made-up data of the tests.
      - name: .env with random values
        run: |
          umask 077
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "HOF_CORE_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "HOF_SAECKEL_DB_PASSWORD=$(openssl rand -hex 24)"
            echo CURRENCY=RUB
            echo TZ=Europe/Moscow
            echo PGPORT=5433
          } > .env

      # Not a service of the job: services start before the checkout, so the init script of the
      # repository could not be mounted into the container.
      # The versions in the log: the output of `docker compose config` differs between them.
      - name: PostgreSQL for the tests
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
          docker compose -f compose.dev.yaml up -d --wait

      - name: npm ci
        run: npm ci

      - name: Prettier
        run: npx prettier --check .

      - name: ESLint
        run: npx eslint .

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Docker image
        run: docker compose build

      - name: Tests
        run: npm test

      # The healthcheck of compose.yaml on the image built above: a started Hof becomes healthy.
      - name: Healthcheck, healthy
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120 postgres hof
          status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q hof)")
          echo "hof: $status"
          test "$status" = healthy

      # deploy/hof-check.sh on the real containers above. The runner has no nginx, copies or
      # certificate, so the result is FAIL; the lines checked are those of Hof and its database.
      # The PostgreSQL of compose.dev.yaml is another project with the same service name: one
      # postgres found proves the filter by project. A PostgreSQL stopped by a signal from the host
      # stays running for Docker but does not answer, while Hof still answers /healthz.
      - name: hof-check, real containers and systemd
        run: |
          sudo groupadd --system hof-backup
          sudo install -d -m 2750 -g hof-backup /var/lib/hof-check
          sudo install -m 755 deploy/hof-check.sh /usr/local/sbin/hof-check
          report="$RUNNER_TEMP/hof-check.txt"

          code=0
          sudo /usr/local/sbin/hof-check > "$report" || code=$?
          cat "$report"
          test "$code" = 2
          grep -qx 'OK   контейнер postgres: running' "$report"
          grep -qx 'OK   живость hof: healthy' "$report"
          grep -qx 'OK   база: pg_isready и SELECT 1 выполнены' "$report"
          grep -qx 'FAIL контейнер nginx: не найден' "$report"
          grep -qE '^(OK   OOM ядра за 7 дней: нет|WARN OOM ядра за 7 дней: [0-9]+, .*)$' "$report"

          postgres=$(docker compose ps -q postgres)
          docker kill --signal=STOP "$postgres"
          code=0
          sudo /usr/local/sbin/hof-check > "$report" || code=$?
          docker kill --signal=CONT "$postgres"
          cat "$report"
          test "$code" = 2
          grep -qx 'OK   контейнер postgres: running' "$report"
          grep -qx 'OK   живость hof: healthy' "$report"
          grep -qx 'FAIL база: не отвечает, ни pg_isready, ни SELECT 1' "$report"

          sudo install -m 644 deploy/hof-check.service deploy/hof-check.timer /etc/systemd/system/
          sudo systemd-analyze verify /etc/systemd/system/hof-check.service /etc/systemd/system/hof-check.timer
          sudo systemctl daemon-reload
          sudo systemctl start hof-check.service
          test "$(systemctl show hof-check.service --property=Result --value)" = success
          sudo head -n 1 /var/lib/hof-check/status.txt | grep -qE '^FAIL [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          test "$(sudo stat -c '%a %G' /var/lib/hof-check/status.txt)" = '640 hof-backup'
          sudo systemctl start hof-check.timer
          systemctl list-timers hof-check.timer
          # The measurement of docs/OPERATIONS.md: runtime, CPU time and the memory peak of one check.
          # Its FAIL is the exit code 2 of the service.
          sudo systemd-run --wait --property=MemoryAccounting=yes --property=CPUAccounting=yes \
            /usr/local/sbin/hof-check || true

      # The same probe against a stand-in server on the port of Hof that answers 500: the container
      # becomes unhealthy. Only the start period and the interval are shorter.
      - name: Healthcheck, unhealthy on 500
        run: |
          cat > "$RUNNER_TEMP/answer-500.yaml" <<'EOF'
          services:
            hof:
              command: [node, -e, "require('node:http').createServer((req, res) => { res.statusCode = 500; res.end(); }).listen(3000)"]
              healthcheck:
                start_period: 0s
                interval: 2s
          EOF
          if docker compose -f compose.yaml -f "$RUNNER_TEMP/answer-500.yaml" up -d --no-build --no-deps --wait --wait-timeout 60 hof; then
            echo 'The healthcheck passed an answer 500'
            exit 1
          fi
          status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q hof)")
          echo "hof: $status"
          test "$status" = unhealthy
